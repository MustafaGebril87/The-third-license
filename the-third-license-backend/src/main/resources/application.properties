# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/the_third_license_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.id.new_generator_mappings=true

# ── Flyway ────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── JWT (set these as environment variables — never commit real values) ────────
# Generate a strong secret: openssl rand -base64 32
security.jwt.secret=${JWT_SECRET}
# Access token: 15 minutes
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
# Refresh token: 7 days
security.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ── Logging (use WARN in production; set LOG_LEVEL=DEBUG locally if needed) ───
logging.level.root=${LOG_LEVEL:WARN}
logging.level.org.springframework.web=${LOG_LEVEL:WARN}
logging.level.org.springframework.security=${LOG_LEVEL:WARN}

# ── App settings ──────────────────────────────────────────────────────────────
app.currency-exchange-rate=1.25

# ── CORS ──────────────────────────────────────────────────────────────────────
app.cors.allowed-origin=${ALLOWED_ORIGIN:http://localhost:5173}

# ── Git repositories (set GIT_REPOS_BASE_PATH on the server; EFS mount point) ─
git.repos.base-path=${GIT_REPOS_BASE_PATH:/repos}

# ── Stripe ────────────────────────────────────────────────────────────────────
stripe.secret.key=${STRIPE_SECRET_KEY}

# ── Cookies (set COOKIE_SECURE=false only for non-HTTPS environments other than localhost) ─
app.cookie.secure=${COOKIE_SECURE:true}

# ── Equity ledger ─────────────────────────────────────────────────────────────
# Founder receives initial-owner-units (=100%); each changed line in an approved
# contribution issues units-per-line new units, diluting everyone proportionally.
app.equity.initial-owner-units=${EQUITY_INITIAL_OWNER_UNITS:1000000}
app.equity.units-per-line=${EQUITY_UNITS_PER_LINE:100}

# ── Stripe Connect / marketplace ─────────────────────────────────────────────
# Signing secret of the webhook endpoint (Dashboard → Developers → Webhooks, or `stripe listen`)
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
# Country for new sellers' Express accounts (your platform's country if using Stripe Atlas: US)
app.stripe.connect-country=${STRIPE_CONNECT_COUNTRY:US}
# Platform fee charged to the buyer on top of the share price, in percent
app.marketplace.fee-percent=${MARKETPLACE_FEE_PERCENT:1.0}
