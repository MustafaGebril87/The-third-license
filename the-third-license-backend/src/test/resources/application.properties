# Test environment — uses in-memory values so tests don't need real env vars
spring.datasource.url=jdbc:postgresql://localhost:5432/the_third_license_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.id.new_generator_mappings=true

# Fixed test secret — never use this outside of tests
security.jwt.secret=VGVzdFNlY3JldEZvclVuaXRUZXN0c09ubHkxMjM0NTY=
security.jwt.expiration-ms=900000
security.jwt.refresh-expiration-ms=604800000

logging.level.root=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN

app.currency-exchange-rate=1.25
app.cors.allowed-origin=http://localhost:5173
stripe.secret.key=sk_test_PLACEHOLDER_FOR_TESTS

# Flyway disabled in tests — Hibernate manages the schema via ddl-auto=update
spring.flyway.enabled=false

# Git repo base path for tests (no real git ops in scenario tests)
git.repos.base-path=/tmp/test-repos

# Cookies over plain http in tests
app.cookie.secure=false

app.equity.initial-owner-units=1000000
app.equity.units-per-line=100
stripe.webhook.secret=whsec_test_secret_for_tests
app.stripe.connect-country=US
app.marketplace.fee-percent=1.0
